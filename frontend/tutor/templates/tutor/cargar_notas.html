{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargar Notas</title>
    <link rel="stylesheet" href="{% static 'css/tutor2.css' %}">
</head>
<body>
    <nav class="nav-tutor">
        <a href="{% url 'cargar_horarios' %}">Cargar Horarios</a>
        <a href="#">Cargar Notas</a>
        <a href="{% url 'cerrar_sesion' %}" class="cerrar">Cerrar Sesión</a>
    </nav>

    <div class="contenido">
        <h2>Carga las notas de los estudiantes al portal</h2>
        <p>Sube o edita tu archivo XML para cargar las notas de los estudiantes.</p>

        {% if mensaje %}
            <div class="mensaje-exito">
                {{ mensaje }}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" id="archivo" name="archivo" accept=".xml"><br><br>
            <textarea id="xml_content" name="xml_content" placeholder="Pega o edita aquí tu archivo XML...">{{ contenido }}</textarea><br>

            <input type="submit" name="accion" value="Procesar Notas" class="btn">
            <input type="submit" name="accion" value="Limpiar Notas" class="btn">
        </form>
    </div>

    <script>
        document.getElementById('archivo').addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('xml_content').value = e.target.result;
                };
                reader.readAsText(file);
            }
        });
    </script>

</body>
</html>
